<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0a0a0a;
      color: #fafaf9;
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .canvas {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #0a0a0a;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Subtle warm ambient lighting from top-right corner */
    .glow {
      position: absolute;
      top: -120px;
      right: -80px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.12) 0%, rgba(10, 10, 10, 0) 70%);
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
    }

    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(234, 88, 12, 0.1);
      border: 1px solid rgba(234, 88, 12, 0.28);
      border-radius: 9999px;
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: #ea580c;
      letter-spacing: 0.02em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ea580c;
    }

    .sub-meta {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: #737373;
    }

    .domain {
      font-family: 'Geist Mono', monospace;
      font-size: 14px;
      color: #a3a3a3;
      letter-spacing: 0.04em;
    }

    .main-content {
      z-index: 1;
      margin-top: 10px;
    }

    .name-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 88px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fafaf9;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.35;
      color: #a3a3a3;
      max-w: 880px;
    }

    .subtitle strong {
      color: #fafaf9;
      font-weight: 500;
    }

    .subtitle em {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      color: #ea580c;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 1;
    }

    .stack {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stack-pill {
      padding: 6px 14px;
      background: #171717;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: #d4d4d4;
    }

    .status {
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: #737373;
    }
  </style>
</head>

<body>
  <div class="canvas">
    <div class="glow"></div>

    <div class="top-bar">
      <div class="badge-wrap">
        <div class="badge">
          <span class="badge-dot"></span>
          Full Stack Design Engineer
        </div>
        <span class="sub-meta">Diamond Atelier · Surat, IN</span>
      </div>
      <div class="domain">tarang.space</div>
    </div>

    <div class="main-content">
      <h1 class="name-title">Tarang Rajpara</h1>
      <p class="subtitle">
        Building <strong>clean architecture</strong> and <em>interfaces that feel good to use.</em>
      </p>
    </div>

    <div class="bottom-bar">
      <div class="stack">
        <span class="stack-pill">TypeScript</span>
        <span class="stack-pill">React</span>
        <span class="stack-pill">Next.js</span>
        <span class="stack-pill">TanStack</span>
        <span class="stack-pill">Tailwind CSS</span>
      </div>
      <div class="status">portfolio &bull; 2026</div>
    </div>
  </div>
</body>

</html>
